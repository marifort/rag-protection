name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-ce-only:
    name: Community Edition (no EE)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install CE dependencies
        working-directory: rag-protection-proxy
        run: |
          python -m pip install --upgrade pip
          # CPU wheel first so sentence-transformers does not pull CUDA torch
          # (that fills the GitHub-hosted runner disk — Errno 28).
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run unit tests
        working-directory: rag-protection-proxy
        run: pytest -q -m "not live"

      - name: Run integration tests (in-process)
        working-directory: rag-protection-proxy
        run: pytest -q -m "integration and not live"

  console:
    name: Operator console (core + CE)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install console dependencies
        working-directory: console
        run: npm ci

      - name: Build shared console-core
        working-directory: console
        run: npm run build:core

      - name: Typecheck
        working-directory: console
        run: npm run typecheck

      - name: Test
        working-directory: console
        run: npm run test

      - name: Build
        working-directory: console
        run: npm run build

  integration-live:
    name: Live stack integration (CE)
    runs-on: ubuntu-latest
    needs: test-ce-only

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install CE dependencies
        working-directory: rag-protection-proxy
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Start proxy (no Model Runner)
        run: |
          mkdir -p data
          docker compose -f compose.ci.yml up -d --build --wait

      - name: Run live integration tests
        working-directory: rag-protection-proxy
        env:
          RUN_INTEGRATION: "1"
          RAG_BASE_URL: http://localhost:8090
        run: pytest -q -m live

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f compose.ci.yml logs --no-color | tail -200

  edition-tree:
    name: CE/EE directory split
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check edition path map
        run: |
          if [ -f edition/check_tree.py ]; then
            python3 edition/check_tree.py
          else
            echo "edition/ absent — public CE export, nothing to classify. Skipping."
          fi
