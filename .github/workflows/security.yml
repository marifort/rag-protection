name: Security Audit

permissions:
  contents: read
  actions: read
  security-events: write

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:
  push:
    branches: [ main, mcp-remote ]
    paths:
      - '**/requirements*.txt'
      - '**/pyproject.toml'
      - '**/Dockerfile'
      - '**/*.py'
      - '.github/workflows/security.yml'
      - '.gitleaks.toml'

jobs:
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    
    - name: Install audit tools
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit

    - name: Run pip-audit
      working-directory: rag-protection-proxy
      continue-on-error: true
      run: |
        pip-audit -r requirements.txt --format json --output pip-audit-report.json
        echo "### Pip Audit Report" >> $GITHUB_STEP_SUMMARY
        echo '```json' >> $GITHUB_STEP_SUMMARY
        cat pip-audit-report.json >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload security reports
      uses: actions/upload-artifact@v5
      with:
        name: dependency-security-reports
        path: rag-protection-proxy/pip-audit-report.json
      if: always()

  code-security:
    name: Code Security Analysis
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    
    - name: Run Bandit
      continue-on-error: true
      run: |
        pip install bandit
        bandit -r rag-protection-proxy/rag_protection_proxy \
          -x '**/test_*.py' -ll -f json -o bandit-report.json
        echo "### Bandit Security Report" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        bandit -r rag-protection-proxy/rag_protection_proxy -x '**/test_*.py' -ll -f txt
        echo '```' >> $GITHUB_STEP_SUMMARY
    
    - name: Run Semgrep
      continue-on-error: true
      run: |
        # semgrep-action@v1 ships an old engine that crashes on rule
        # severity MEDIUM from the current --config auto registry.
        pip install semgrep
        semgrep scan --config auto --metrics off \
          rag-protection-proxy/rag_protection_proxy
    
    - name: Upload code security reports
      uses: actions/upload-artifact@v5
      with:
        name: code-security-reports
        path: bandit-report.json
      if: always()

  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/mcp-remote'
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        ignore-unfixed: true
      continue-on-error: true
    
    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'
      # Private repos without GitHub Advanced Security reject this upload.
      # Do not skip Hadolint when the Security tab is unavailable.
      if: always() && hashFiles('trivy-results.sarif') != ''
      continue-on-error: true
    
    - name: Dockerfile linting
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: rag-protection-proxy/Dockerfile
        format: json
        output-file: hadolint-report.json
        failure-threshold: error
      continue-on-error: false
    
    - name: Upload Docker security reports
      uses: actions/upload-artifact@v5
      with:
        name: docker-security-reports
        path: |
          trivy-results.sarif
          hadolint-report.json
      if: always()

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: TruffleHog OSS
      uses: trufflesecurity/trufflehog@v3.88.0
      with:
        path: ./
        extra_args: --only-verified
      continue-on-error: false

    - name: Gitleaks (current tree)
      run: |
        # Extract off-tree. The release tarball ships a README.md with
        # cafebabe:deadbeef (sidekiq-secret example); unpacking in the
        # workspace made gitleaks scan its own docs.
        TMP="$(mktemp -d)"
        wget -q -O "$TMP/gitleaks.tgz" \
          https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
        tar -xzf "$TMP/gitleaks.tgz" -C "$TMP"
        "$TMP/gitleaks" detect --source "$GITHUB_WORKSPACE" --no-git --verbose \
          --config .gitleaks.toml --report-path "$TMP/gitleaks-report.json"
        echo "### Gitleaks Report" >> $GITHUB_STEP_SUMMARY
        if [ -f "$TMP/gitleaks-report.json" ]; then
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat "$TMP/gitleaks-report.json" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        else
          echo "No secrets detected" >> $GITHUB_STEP_SUMMARY
        fi
      continue-on-error: false
