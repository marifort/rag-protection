# RAG Protection Proxy — Splunk sourcetype (Lab 3 SIEM pack)
# Install: copy into $SPLUNK_HOME/etc/apps/rag_protection/local/props.conf
#          or merge into an existing HEC sourcetype stanza.
#
# Ingest: push via RAG_AUDIT_WEBHOOK_URL (Splunk HEC) or pull NDJSON from
#         RAG_AUDIT_FILE / GET /admin/audit/export

[rag_protection:audit]
SHOULD_LINEMERGE = false
TRUNCATE = 0
TIME_PREFIX = "timestamp":
TIME_FORMAT = %s.%Q
MAX_TIMESTAMP_LOOKAHEAD = 32
KV_MODE = none
INDEXED_EXTRACTIONS = json
ANNOTATE_PUNCT = false

# Stable top-level fields for detections (field-stability promise: docs/SIEM_FIELD_GUIDE.md)
FIELDALIAS-kind = kind AS rag_kind
FIELDALIAS-decision = decision AS rag_decision
FIELDALIAS-subject = subject AS rag_subject
FIELDALIAS-tenant = tenant_id AS rag_tenant_id
FIELDALIAS-risk = risk_score AS rag_risk_score
FIELDALIAS-source = source AS rag_source
