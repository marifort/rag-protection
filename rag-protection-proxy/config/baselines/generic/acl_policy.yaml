# Generic CE baseline ACL — production-shaped (no demo tokens).
# Validated by: rag-scan check --env prod

default_groups:
  - all-staff

group_hierarchy:
  executives:
    - all-staff
  hr:
    - all-staff
  engineering:
    - all-staff
  data-platform:
    - all-staff
  admin:
    - data-platform
    - all-staff

jwt_groups_claim: groups
jwt_secret: ""
jwt_algorithms:
  - HS256

oidc:
  enabled: true
  issuer: "https://REPLACE-ME.okta.com/oauth2/default"
  audience: "api://rag-protection"
  jwks_uri: "https://REPLACE-ME.okta.com/oauth2/default/v1/keys"
  algorithms:
    - RS256
  groups_claim: groups
  roles_claim: roles
  admin_role_map:
    policy_admin: [rag-platform-admins]
    audit_reader: [rag-soc-readers]
    audit_debug_reader: [rag-soc-debug]
    ingest_admin: [rag-content-admins]
  admin_global_groups: [rag-platform-admins]

demo_users: []
admin_users: []

scim:
  enabled: false
  base_url: ""
  bearer_token: ""
  poll_interval_seconds: 300

tenants: {}
