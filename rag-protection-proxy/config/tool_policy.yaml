# Tool gateway policy (Lab 1 — Agent / MCP tool gateway)
# Loaded via RAG_TOOL_POLICY_FILE (default: ./config/tool_policy.yaml)

defaults:
  challenge_threshold: 0.4
  block_threshold: 0.8
  challenge_mode: block

tools:
  send_email:
    description: Send an email message to one or more recipients.
    backend: mock_email
    allowed_groups:
      - all-staff
    max_args_bytes: 8192
    blocked_domains:
      - personal-email.com
      - mailinator.com
    scan_arguments:
      - body
      - subject

  read_file:
    description: Read a file from the sandbox filesystem.
    backend: mock_files
    allowed_groups:
      - engineering
      - hr
      - executives
    max_args_bytes: 4096
    blocked_patterns:
      - "../"
      - "/etc/"
      - ".ssh"
    scan_arguments:
      - path

  run_sql:
    description: Execute a read-only SQL query against the analytics database.
    backend: mock_sql
    allowed_groups:
      - data-platform
      - admin
    max_args_bytes: 4096
    blocked_patterns:
      - DROP TABLE
      - DELETE FROM
      - TRUNCATE
      - ";--"
    scan_arguments:
      - query
