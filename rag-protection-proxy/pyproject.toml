[project]
name = "rag-protection-proxy"
version = "0.1.0"
description = "Marifort Gate — ACL gateway for RAG with DLP, injection shielding, and citation auditing"
license = { text = "MIT" }
authors = [{ name = "Marifort Systems Inc.", email = "support@marifort.com" }]
maintainers = [{ name = "Marifort Systems Inc.", email = "support@marifort.com" }]
requires-python = ">=3.11"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
  "pydantic>=2.9.0",
  "PyJWT[crypto]>=2.9.0",
  "prometheus-client>=0.21.0",
  "qdrant-client>=1.12.0",
  "sentence-transformers>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/marifort/rag-protection"
Issues = "https://github.com/marifort/rag-protection/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "langchain-core>=0.3.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rag_protection_proxy*"]

# Operator console assets (built by tools/build_ce.sh). Without this, wheels only
# ship ui/__init__.py and GET /ui returns "UI not bundled."
[tool.setuptools.package-data]
rag_protection_proxy = [
  "ui/static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
  "integration: in-process pipeline tests (SQLite vs vector backend)",
  "live: requires RUN_INTEGRATION=1 and a running compose stack",
]
