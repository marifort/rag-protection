<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="565" viewBox="0 0 600 565">

<style>
  .box { fill: #e8f4fc; stroke: #2563eb; stroke-width: 1.5; rx: 6; }
  .store { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
  .llm { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.5; }
  .user { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
  .label { font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111; }
  .title { font: bold 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111; }
  .small { font: 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #444; }
  .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 3; rx: 8; }
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker></defs>

<text x="300" y="22" text-anchor="middle" class="title">Query Pipeline</text>
<rect x="150" y="50" width="300" height="40" class="user"/><text x="300" y="64" text-anchor="middle" class="label">User</text><text x="300" y="84" text-anchor="middle" class="small">POST /v1/query + Bearer token</text><line x1="300" y1="90" x2="300" y2="105" class="arrow"/><rect x="150" y="105" width="300" height="40" class="box"/><text x="300" y="119" text-anchor="middle" class="label">ACL</text><text x="300" y="139" text-anchor="middle" class="small">resolve_auth → groups</text><line x1="300" y1="145" x2="300" y2="160" class="arrow"/><rect x="150" y="160" width="300" height="40" class="box"/><text x="300" y="174" text-anchor="middle" class="label">Store</text><text x="300" y="194" text-anchor="middle" class="small">search with ACL filter</text><line x1="300" y1="200" x2="300" y2="215" class="arrow"/><rect x="150" y="215" width="300" height="40" class="box"/><text x="300" y="229" text-anchor="middle" class="label">Input</text><text x="300" y="249" text-anchor="middle" class="small">scan_input per chunk</text><line x1="300" y1="255" x2="300" y2="270" class="arrow"/><rect x="150" y="270" width="300" height="40" class="box"/><text x="300" y="284" text-anchor="middle" class="label">Context</text><text x="300" y="304" text-anchor="middle" class="small">XML-isolated prompt</text><line x1="300" y1="310" x2="300" y2="325" class="arrow"/><rect x="150" y="325" width="300" height="40" class="box"/><text x="300" y="339" text-anchor="middle" class="label">LLM</text><text x="300" y="359" text-anchor="middle" class="small">chat completion</text><line x1="300" y1="365" x2="300" y2="380" class="arrow"/><rect x="150" y="380" width="300" height="40" class="box"/><text x="300" y="394" text-anchor="middle" class="label">Citation</text><text x="300" y="414" text-anchor="middle" class="small">verify grounding</text><line x1="300" y1="420" x2="300" y2="435" class="arrow"/><rect x="150" y="435" width="300" height="40" class="box"/><text x="300" y="449" text-anchor="middle" class="label">Output</text><text x="300" y="469" text-anchor="middle" class="small">scan_output DLP</text><line x1="300" y1="475" x2="300" y2="490" class="arrow"/><rect x="150" y="490" width="300" height="40" class="user"/><text x="300" y="504" text-anchor="middle" class="label">User</text><text x="300" y="524" text-anchor="middle" class="small">answer or safe fallback</text>
</svg>
