<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="180" viewBox="0 0 880 180">

<style>
  .box { fill: #e8f4fc; stroke: #2563eb; stroke-width: 1.5; rx: 6; }
  .store { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
  .llm { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.5; }
  .user { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
  .label { font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111; }
  .title { font: bold 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111; }
  .small { font: 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #444; }
  .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 3; rx: 8; }
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker></defs>

<text x="440" y="22" text-anchor="middle" class="title">Four Security Guardrails</text>
<rect x="30" y="80" width="100" height="50" class="box"/><text x="80" y="105" text-anchor="middle" class="label">User Query</text><line x1="130" y1="105" x2="150" y2="105" class="arrow"/><rect x="150" y="80" width="100" height="50" class="box"/><text x="200" y="105" text-anchor="middle" class="label">1. ACL Filter</text><line x1="250" y1="105" x2="270" y2="105" class="arrow"/><rect x="270" y="80" width="100" height="50" class="box"/><text x="320" y="105" text-anchor="middle" class="label">2. Input DLP</text><line x1="370" y1="105" x2="390" y2="105" class="arrow"/><rect x="390" y="80" width="100" height="50" class="box"/><text x="440" y="99" text-anchor="middle" class="label">3. Context Iso</text><text x="440" y="119" text-anchor="middle" class="small">lation</text><line x1="490" y1="105" x2="510" y2="105" class="arrow"/><rect x="510" y="80" width="100" height="50" class="llm"/><text x="560" y="105" text-anchor="middle" class="label">LLM</text><line x1="610" y1="105" x2="630" y2="105" class="arrow"/><rect x="630" y="80" width="100" height="50" class="box"/><text x="680" y="99" text-anchor="middle" class="label">4. Citation + </text><text x="680" y="119" text-anchor="middle" class="small">Output</text><line x1="730" y1="105" x2="750" y2="105" class="arrow"/><rect x="750" y="80" width="100" height="50" class="box"/><text x="800" y="105" text-anchor="middle" class="label">Response</text>
</svg>
