<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320">

<style>
  .box { fill: #e8f4fc; stroke: #2563eb; stroke-width: 1.5; rx: 6; }
  .store { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
  .llm { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.5; }
  .user { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
  .label { font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111; }
  .title { font: bold 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111; }
  .small { font: 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #444; }
  .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 3; rx: 8; }
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker></defs>

<text x="350" y="22" text-anchor="middle" class="title">Deployment Architecture</text>
<rect x="240" y="70" width="200" height="40" class="box"/><text x="340" y="84" text-anchor="middle" class="label">rag-protection-proxy</text><text x="340" y="104" text-anchor="middle" class="small">port 8090</text><rect x="80" y="160" width="160" height="40" class="user"/><text x="160" y="180" text-anchor="middle" class="label">Developer / UI</text><rect x="440" y="160" width="180" height="40" class="store"/><text x="530" y="180" text-anchor="middle" class="label">rag-data volume</text><rect x="240" y="250" width="200" height="40" class="llm"/><text x="340" y="270" text-anchor="middle" class="label">Docker Model Runner</text><line x1="160" y1="180" x2="240" y2="110" class="arrow"/><line x1="340" y1="110" x2="530" y2="160" class="arrow"/><line x1="340" y1="110" x2="340" y2="250" class="arrow"/>
</svg>
