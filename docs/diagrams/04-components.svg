<rect x="225" y="70" width="140" height="22" class="box"/><text x="295" y="81" text-anchor="middle" class="label">pipeline.py</text><rect x="225" y="98" width="140" height="22" class="box"/><text x="295" y="109" text-anchor="middle" class="label">acl.py / store.py</text><rect x="225" y="126" width="140" height="22" class="box"/><text x="295" y="137" text-anchor="middle" class="label">llm.py</text><rect x="225" y="154" width="140" height="22" class="box"/><text x="295" y="165" text-anchor="middle" class="label">config.py</text>
