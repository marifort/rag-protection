<rect x="415" y="70" width="140" height="22" class="box"/><text x="485" y="81" text-anchor="middle" class="label">input_pipeline</text><rect x="415" y="98" width="140" height="22" class="box"/><text x="485" y="109" text-anchor="middle" class="label">output_pipeline</text><rect x="415" y="126" width="140" height="22" class="box"/><text x="485" y="137" text-anchor="middle" class="label">citation.py</text>
