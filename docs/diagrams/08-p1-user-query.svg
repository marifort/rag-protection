<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="370" viewBox="0 0 640 370">

<style>
  .box { fill: #e8f4fc; stroke: #2563eb; stroke-width: 1.5; rx: 6; }
  .store { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
  .llm { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.5; }
  .user { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
  .label { font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111; }
  .title { font: bold 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111; }
  .small { font: 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #444; }
  .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 3; rx: 8; }
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker></defs>

<text x="320" y="22" text-anchor="middle" class="title">P1 User-Query Guardrails</text>
<rect x="200" y="50" width="200" height="32" class="user"/><text x="300" y="60" text-anchor="middle" class="label">User / UI</text><text x="300" y="80" text-anchor="middle" class="small">POST /v1/query</text><line x1="300" y1="82" x2="300" y2="100" class="arrow"/><rect x="170" y="100" width="260" height="32" class="box"/><text x="300" y="116" text-anchor="middle" class="label">pipeline.run_query</text><line x1="300" y1="132" x2="300" y2="150" class="arrow"/><rect x="190" y="150" width="220" height="32" class="box"/><text x="300" y="160" text-anchor="middle" class="label">scan_input</text><text x="300" y="180" text-anchor="middle" class="small">user query</text><line x1="300" y1="182" x2="300" y2="210" class="arrow"/><rect x="215" y="210" width="170" height="36" class="box"/><text x="300" y="228" text-anchor="middle" class="label">effective BLOCK?</text>
<text x="60" y="280" class="small">yes → blocked (query_guardrail_blocked)</text>
<text x="60" y="300" class="small">no → store.search → chunks → LLM → QueryResponse</text>
<line x1="215" y1="228" x2="120" y2="260" class="arrow"/><line x1="385" y1="228" x2="480" y2="260" class="arrow"/><rect x="40" y="310" width="160" height="32" class="box"/><text x="120" y="320" text-anchor="middle" class="label">blocked</text><text x="120" y="340" text-anchor="middle" class="small">no LLM</text><rect x="420" y="310" width="200" height="32" class="user"/><text x="520" y="320" text-anchor="middle" class="label">QueryResponse</text><text x="520" y="340" text-anchor="middle" class="small">after chunk scan + LLM</text>
</svg>
