<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410">

<style>
  .box { fill: #e8f4fc; stroke: #2563eb; stroke-width: 1.5; rx: 6; }
  .store { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
  .llm { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.5; }
  .user { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
  .label { font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111; }
  .title { font: bold 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111; }
  .small { font: 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #444; }
  .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 3; rx: 8; }
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker></defs>

<text x="320" y="22" text-anchor="middle" class="title">P1 Ingest-Time Security</text>
<rect x="170" y="50" width="260" height="40" class="store"/><text x="300" y="64" text-anchor="middle" class="label">POST /v1/ingest</text><text x="300" y="84" text-anchor="middle" class="small">admin</text><line x1="300" y1="90" x2="300" y2="105" class="arrow"/><rect x="170" y="105" width="260" height="40" class="box"/><text x="300" y="125" text-anchor="middle" class="label">scan_ingest_content</text><line x1="300" y1="145" x2="300" y2="160" class="arrow"/><rect x="170" y="160" width="260" height="40" class="box"/><text x="300" y="174" text-anchor="middle" class="label">evaluate_ingest_scan</text><text x="300" y="194" text-anchor="middle" class="small">rejected / quarantined / ok</text><line x1="300" y1="200" x2="300" y2="215" class="arrow"/><rect x="170" y="215" width="260" height="40" class="box"/><text x="300" y="229" text-anchor="middle" class="label">store document</text><text x="300" y="249" text-anchor="middle" class="small">active or quarantined</text><line x1="300" y1="255" x2="300" y2="270" class="arrow"/><rect x="170" y="270" width="260" height="40" class="box"/><text x="300" y="284" text-anchor="middle" class="label">admin approve</text><text x="300" y="304" text-anchor="middle" class="small">if quarantined</text><line x1="300" y1="310" x2="300" y2="325" class="arrow"/><rect x="170" y="325" width="260" height="40" class="box"/><text x="300" y="339" text-anchor="middle" class="label">searchable</text><text x="300" y="359" text-anchor="middle" class="small">ACL filter</text>
<text x="450" y="165" class="small">rejected → HTTP 422</text>
<text x="450" y="220" class="small">quarantined → approve → active</text>

</svg>
