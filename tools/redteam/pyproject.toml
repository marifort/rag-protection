[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-redteam"
version = "0.1.0"
description = "Packaged RAG red-team harness (Lab 5)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "PyYAML>=6.0"]

[project.scripts]
rag-redteam = "redteam.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["redteam*"]
